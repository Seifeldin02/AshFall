# Deployment manifest: everything a staging -> production promotion must handle that Git does NOT track.
#
# Git tracks smpcore-src/ only. Every path below lives on the servers themselves, so a "git diff main..staging"
# review will never mention it. Before this manifest existed, promotion relied on remembering these by hand --
# which is how the Nether anti-xray config sat unpromoted for a full release: the approved setting lives in a
# per-dimension paper-world.yml INSIDE the world folder, a directory deploys deliberately never touch because
# it also holds world data. Anything added here is checked automatically by check_deploy.py.
#
# sync   : must be semantically identical on both servers; promote staging -> production.
# env    : must exist on both and is INTENTIONALLY different (ports, secrets, motd). Never copy.
#          `assert` pins the values production must have, so a careless copy is caught immediately.
# plugins: jars that must be present on production for the current build to work.

servers:
  staging: C:/MinecraftServer-Staging
  production: C:/MinecraftServer

sync:
  - path: plugins/SMPCore/config.yml
    do_not_autofix: true
    note: |
      DO NOT PROMOTE THIS FILE WITH --fix. It carries two STAGING-ONLY keys under trusted-admin
      (same-machine-autologin, staging-session-persistence) that must never exist on production, and --fix
      copies the whole file. It did exactly that during the 2026-09-02 promotion and they had to be stripped
      out again by hand a minute later. Promote the changed KEYS by hand, or run --fix and then re-check the
      trusted-admin block. do_not_autofix makes --fix report it and skip it.

      Main plugin config. Owner-fixed values that have silently failed to reach production before:
        EXPECTED staging-only difference: trusted-admin.same-machine-autologin is set on staging and must
        NEVER appear in production or in the shipped resource -- it is what lets an admin reuse AuthMe's
        same-IP session from this machine. A config.yml DIFF consisting solely of that key is correct.
        progression.rank-rewards.VANGUARD  250000   (the code fallback in ProgressService must match)
        shop.buy-multiple                  5        (commodity buy = 5x sell, derived at load)
        NEW 2026-08-20 (duel rebuild): duel-maps.*.bounds, duel-maps.*.source-world,
        duel-maps-import.columns-per-tick, arena.setup-timeout-seconds, duel-loot.chunks-per-tick and
        industrial-hopper.comparator-output. A jar swap does NOT carry any of them.
  - path: plugins/SMPCore/bosses.yml
  - path: plugins/SMPCore/shop.yml
    note: |
      OWNER-FIXED PRICES - do not change without an explicit instruction, and never "tidy" them.
      Commodity buy prices are DERIVED as exactly 5x sell at load time (shop.buy-multiple); editing a buy
      value by hand does nothing. Luxury prices fixed by the owner on 2026-08-09:
        OMINOUS_TRIAL_KEY (Reusable Villager Capsule) 5000000
        HEAVY_CORE                                   10000000
        SILENCE_ARMOR_TRIM_SMITHING_TEMPLATE          1000000
        NETHER_STAR                                    500000
        BEACON                                         750000
      ShopService.selfTest() asserts every one of these plus the 5x rule, so a drift fails the self-test.
  - path: plugins/SMPCore/shards.yml
    note: |
      OWNER-FIXED SHARD PRICES (2026-08-09): mace 360, fortune_excavator 360, silk_excavator 360,
      netherite_helmet 150, netherite_boots 170, netherite_leggings 200, bow 80, reusable_capsule 360.
      Everything else is unchanged on purpose. ShardService.selfTest() pins these.
  - path: plugins/SMPCore/relics.yml
  - path: plugins/SMPCore/events.yml
  - path: plugins/SMPCore/duel-templates
    note: |
      COMMITTED DUEL MAP SNAPSHOTS (added 2026-08-20). One folder per map key; each is a world folder
      (region/, entities/, poi/, data/) with NO level.dat -- that is normal for a Paper dimension folder and
      is not a sign of a broken copy. These are what a duel match actually clones; the live duel_tpl_* worlds
      are only what admins build in and are NOT needed on production.

      A jar swap alone does not carry these. Without them production reports every imported map as
      "NOT COMMITTED - matches cannot use this map" (check with /ashfall duelmap snapshots) and the map is
      simply not offered on the duel Map screen.

      arena50 and arena100 CAN be regenerated on production instead, from code:
        /ashfall duelmap build arena50   and   /ashfall duelmap build arena100
      The four imported maps cannot -- /ashfall duelmap import reads the SOURCE overworld, and those arenas
      were built on staging after the 2026-08-17 world clone. Copy the folders.

      Do NOT copy duel-templates/__canary; it is a test artefact of /ashfall duelmap canary.
  - path: plugins/SMPCore/colosseum.yml
    note: |
      COLOSSEUM CONFIGURATION (added 2026-09-02). Every value the three Colosseum bosses have -- names,
      icons, entity types, health, damage, armour, movement, knockback resistance, every ability value and
      cooldown, time limits, entry fees, cash prizes, reward tables, availability, per-boss daily reward
      limits and which arena each fights in -- plus the arena registry, the global concurrency limit and the
      daily rewarded-victory cap.

      A JAR SWAP DOES NOT CARRY THIS. The shipped resource is only written when the file does not already
      exist, so an existing server keeps whatever it has. Promote the file, then run
      /ashfall colosseum reload (which also interrupts and refunds any encounter running at that moment).

      The money lives here: economy.daily-rewarded-victories is the brake that stops the Colosseum being an
      unlimited money printer. At the default fee/prize it caps Colosseum profit at $1,500,000 per player
      per day. Do not raise it without deciding what that number should be.

      2026-09-03: now SIX bosses, and two keys that a jar swap will not carry and that matter:

        economy.victory-shards (default 3) -- Shards a rewarded victory pays. These come from the SAME
        ShardService and the SAME daily allowance as world bosses; there is no separate Colosseum shard
        balance or cap. Raising this does not raise the daily cap, it only changes how fast a player
        reaches it.

        bosses.<key>.environment (NORMAL | NETHER) -- which world environment that boss's disposable
        instance is CREATED with. Only emberbound_duelist is NETHER, because a Wither Skeleton is
        Nether-native and burns in Overworld daylight; the arena, blocks and bounds are identical either
        way and no Nether terrain is generated. Changing this to NORMAL will make that boss catch fire the
        moment somebody edits the arena's pinned time of day.

      Each boss also carries strength / weakness / counterplay strings that the GUI prints and the selftest
      requires to be non-empty, and max-single-hit-percent, which stops one enormous opening blow skipping
      an encounter's mechanics and announces itself when it fires.

      2026-09-04: the Chainbound Behemoth's charge keys changed shape and a jar swap will not update them.
      A live colosseum.yml carrying the old block will run a charge that does nothing useful:

        charge.length is now the distance actually RUN, not only the distance drawn. charge.speed is
        blocks per game tick and a step is twice it (the encounter ticks every 2). probe-distance is gone.

        New and required for the fight to behave: hit-height, step-up, step-down, stuck-grace-steps, and
        miss-crashes. miss-crashes: true is what makes a dodged charge punishable anywhere in the arena
        rather than only next to a wall -- turning it off removes the encounter's only real punish window
        and makes its printed counterplay a lie.

      Copy the shipped colosseum.yml charge block over the live one, then /ashfall reload.
  - path: plugins/SMPCore/colosseum-templates
    note: |
      COMMITTED COLOSSEUM ARENA SNAPSHOTS (added 2026-09-02). Same shape and same rules as duel-templates
      above -- one folder per arena key, a Paper dimension folder with no level.dat -- and the same
      consequence if it is missing: /colosseum offers nothing, and /ashfall selftest reports
      "Colosseum arena snapshots committed: 0/1".

      2026-09-04: a SECOND folder can appear here, named <arena>__nether. It is a DERIVED cache, not a
      commit: the Overworld snapshot re-shaped for a Nether-environment instance, built automatically the
      first time a Nether boss is fought and rebuilt whenever the arena is re-committed. An Overworld
      snapshot cloned straight into a Nether world hands Paper chunks whose light arrays do not fit -- 84
      "Failed to parse light data" stack traces and a full re-light per instance, measured.

      Safe to delete: it is rebuilt on next use, at the cost of one noisy conversion. Do NOT hand-edit it
      or treat it as the arena; /ashfall colosseum save <arena> is still the only way to commit a change,
      and committing drops this copy automatically.

      If a <arena>__nether folder already exists that was built before b498d2b, DELETE IT. The conversion
      originally only re-shaped the arena's own chunks, which left the world spawn and the lighting ring
      around the edges in the old shape -- seven chunks that then threw on every instance load afterwards.
      A snapshot converted by the current build reports zero. Production has never had one, so this only
      applies to a server that ran an intermediate build.

      DELIBERATELY SEPARATE from duel-templates. The Colosseum arena was seeded once from the committed
      arena100 duel snapshot and is its own world from that point on; editing one can never alter the other,
      which is the whole reason for the split.

      Unlike the imported duel maps, this one CAN be regenerated on production from code, because its base
      is the code-built flat arena rather than a copy of the overworld:
        /ashfall duelmap build arena100     (only if arena100 is not already committed)
        /ashfall colosseum create ashen_colosseum
        /ashfall colosseum save ashen_colosseum
      Copying the folder is still faster and keeps any hand-built decoration.
  - path: config/paper-world-defaults.yml
    note: |
      Global Paper world defaults; the per-dimension files below OVERRIDE this.
      Holds entities.spawning.iron-golems-can-spawn-in-air: true (2026-08-22). Without it the 50m Iron
      Golem Spawner silently produces nothing whenever it is not sitting on solid ground -- see the assert
      below, which is the real guard, because this file is regenerated by Paper on version bumps.
  # Per-dimension Paper configs. These live inside the world folder and override paper-world-defaults.yml.
  # Easy to miss precisely because world/ is otherwise off-limits during a deploy.
  - path: world/dimensions/minecraft/overworld/paper-world.yml
  - path: world/dimensions/minecraft/the_nether/paper-world.yml
    note: holds the approved Nether anti-xray engine-mode 2 override
  - path: world/dimensions/minecraft/the_end/paper-world.yml
  - path: world/dimensions/minecraft/ashfall_reconstruction_normal/paper-world.yml
  - path: world/dimensions/minecraft/ashfall_reconstruction_the_end/paper-world.yml
  - path: config/paper-global.yml
  - path: spigot.yml
    ignore_keys:
      # Each server points restart-script at its OWN absolute path, so this one value must differ while the
      # rest of the file stays in lockstep. Absolute rather than relative on purpose: the watchdog's child
      # inherits the JVM's environment, and NoDefaultCurrentDirectoryInExePath alone makes a relative script
      # name fail with "not recognized" while the file is sitting right there.
      - settings.restart-script
    note: |
      Owner-approved 2026-09-01 after the console stall (DEVELOPMENT_LOG.md):
        log-named-deaths     false   was true; 9,694 of 10,704 lines in one day were one creeper farm
        log-villager-deaths  false   same reasoning
        restart-script       ABSOLUTE path to restart-server.bat, was ./start.sh and could never run
        timeout-time         60      unchanged, but only useful now that the restart script exists
      A jar swap does not carry any of this. See yaml_asserts below, which pins all four.
  - path: bukkit.yml
  - path: disable-quickedit.ps1
    note: |
      The ORIGINAL per-console QuickEdit fix, kept because it costs nothing and closes the window before the
      JVM starts. It is NOT sufficient on its own -- see console-guard.ps1 below, and the 2026-09-01 entry in
      DEVELOPMENT_LOG.md. Measured live: with this script having just run, the console mode at JVM start was
      still 0x1F7, QuickEdit bit set.
  - path: console-guard.ps1
    note: |
      ADDED 2026-09-01 after the 22h 35m production console stall. Runs ALONGSIDE the JVM and re-asserts the
      console mode every five seconds, because JLine sets its own mode when Paper initialises the terminal
      (observed: 0x9, extended flags cleared) and nothing re-asserted it afterwards. Logs to
      logs/console-guard.log, never to the console -- writing to the console is the thing being guarded.
      start.bat / start-staging.bat must launch it with `start /b`. Verify with an external probe attached to
      the server console: mode must read 0x89 while Java is running.
  - path: storage-guard.ps1
    note: |
      ADDED 2026-09-02 after Prism's database reached 36.4 GB with nothing anywhere reporting it -- the
      server itself sat at a flawless 20.0 TPS throughout, because Prism commits off the main thread, so
      every in-game signal said healthy while the host drowned in write I/O.

      Checks plugins/prism/prism.db and free disk every 15 minutes; logs to logs/storage-guard.log and warns
      in-game over RCON on a CHANGE of state. Warn/alarm: Prism 2/5 GB, free disk 40/20 GB. The 2 GB warning
      is ~10x the measured post-filter steady state (~0.22 GB over a 7-day window). Launched by the
      launchers with `start /b`.
  - path: plugins/prism/prism.conf
    note: |
      BOUNDS PRISM'S GROWTH. Do not let these three revert:
        vehicle-ride / vehicle-exit = false   66.8% of the old 36.4 GB was oak boats in one creeper farm
        filter ignore-environmental-mob-deaths  IGNORE entity-death whose named-cause is environmental
                                              (fall/cramming/drowning/...); 32% more of the old database.
                                              Keyed on CAUSE so player kills and boss kills are still kept.
        purge before:7d                       was 6w, which had NEVER fired because the data was younger
                                              than the window the whole time.
      Everything else stays ON deliberately -- block, container, item, player-death and audit actions cost
      almost nothing (0.85% of rows combined) and are the entire point of the plugin.
      Pre-reset copies: config-templates/prism/*.pre-reset-20260902
  - path: freeze-watchdog.ps1
    note: |
      ADDED 2026-09-02. Probes RCON from OUTSIDE the JVM every 30s and, after 10 consecutive unanswered
      probes (~5 min), calls restart-server.bat and kills the JVM. This is the layer that bounds ANY hang --
      deadlock, plugin loop, GC spiral, blocked console -- to minutes rather than hours. RCON is the probe
      because answering it requires the main thread; a bare TCP connect stayed up all through the
      2026-08-31 outage. Launched by start.bat / start-staging.bat with `start /b`.

      KNOWN BEHAVIOUR: it exits with its console, so it is absent until the next server start. Verified end
      to end on staging by suspending the JVM with NtSuspendProcess: detected, killed and restarted with no
      human involved.
  - path: restart-server.bat
    note: |
      ADDED 2026-09-01. spigot.yml settings.restart-script now points at this file by ABSOLUTE path; it used
      to be ./start.sh, a Linux path on a Windows host, so Spigot's isFile() check failed and the watchdog
      restart silently did nothing. Identical on both servers on purpose; it picks the local launcher by
      which one exists next to it.

# Values production must actually have, asserted independently of the staging<->production comparison.
# A sync check can only prove the two servers match -- if a setting is dropped from BOTH at once it looks
# perfectly in sync while being wrong, which is exactly how ReplayCore came back on.
yaml_asserts:
  - path: spigot.yml
    key: settings.log-named-deaths
    equals: false
    note: |
      The console stall's contributing factor. True here means one busy mob farm can emit ten thousand
      console lines a day, which is what turned a stray text selection into a 22-hour outage.
  - path: spigot.yml
    key: settings.log-villager-deaths
    equals: false
  - path: spigot.yml
    key: settings.restart-on-crash
    equals: true
    note: without this the watchdog halts the JVM and nothing brings it back.
  - path: plugins/SMPCore/config.yml
    key: integrations.disabled-plugins
    contains: ReplayCore
    note: ReplayCore is deliberately disabled; its recording can only be turned off from its own cloud dashboard.
  - path: config/paper-world-defaults.yml
    key: entities.spawning.iron-golems-can-spawn-in-air
    equals: true
    note: |
      Iron Golem is the only mob that still demands solid ground beneath a SPAWNER spawn -- every other type
      is waived by Mob.checkMobSpawnRules, but IronGolem#checkSpawnObstruction re-imposes it and BaseSpawner
      calls that unconditionally. False here means a purchased golem spawner over a drop shaft spawns nothing
      at all, with no error anywhere, which is exactly how it went unnoticed for a month.

# Jars whose internal build string must match, because their filename does not carry the version.
jar_versions:
  - path: plugins/Geyser-Spigot.jar
    entry: git.properties
    contains: "2.11.1-b1214"
    note: Bedrock 26.0-26.40. Older builds load fine but reject all Bedrock logins as outdated.
  - path: plugins/floodgate-spigot.jar
    entry: plugin.yml
    contains: "b140"

env:
  - path: launch-via-conhost.bat
    note: |
      The visible-console launcher, in BOTH server directories, each cd-ing to its own. Every path inside it
      must stay ABSOLUTE (%~dp0-derived). It used a relative script name for years, worked fine from a normal
      console, and failed silently the first time restart-server.bat called it -- the recovery child inherits
      the JVM environment, and NoDefaultCurrentDirectoryInExePath alone makes cmd answer "not recognized"
      with the file sitting right there. A repo copy of the shape is in config-templates/.
  - path: start.bat
    note: |
      JVM FLAGS ARE LOAD-BEARING, not tuning. -Dlog4j2.AsyncQueueFullPolicy=Discard and
      -Dlog4j2.DiscardThreshold=ERROR are the fix for the 2026-08-31 console stall: Paper wraps the file and
      console appenders in ONE Log4j AsyncAppender, and the DEFAULT full-queue policy makes the producer --
      the server thread -- block until there is room. Discard drops log lines instead. A launcher that loses
      these flags re-opens a 22-hour outage. Verified present on production 2026-09-02.

      Production launcher. Differs from staging by heap and by filename (staging uses start-staging.bat), so
      it is never copied -- but BOTH must invoke disable-quickedit.ps1 before the JVM and launch
      console-guard.ps1 with `start /b` alongside it. A launcher missing the guard is how the 2026-08-31
      outage happened.
  - path: server.properties
    assert:
      server-port: "25565"
      rcon.port: "25575"
      query.port: "25565"
      max-players: "500"
      motd: "Ashfall Concord"
      level-name: "world"
  - path: plugins/Geyser-Spigot/config.yml
    note: Bedrock listener port differs (prod 19132 / staging 19133)

# Artifacts that exist ONLY on staging and must never be copied to production, but still have to be
# tracked -- their absence on production is correct, while their absence on STAGING is a fault.
staging_only:
  - path: start-staging.bat
    note: |
      Staging launcher. Same two requirements as production's start.bat: invoke disable-quickedit.ps1 before
      the JVM, and launch console-guard.ps1 with `start /b` alongside it. Differs by heap (-Xmx2G) and by
      name, which is why it is not an env entry -- production has no file by this name at all.

plugins:
  # Geyser and Floodgate are the Bedrock runtime. These are pinned by FILENAME here, but the filename is
  # version-less, so the check below also asserts the build inside the jar -- an outdated Geyser silently
  # rejects every Bedrock player with "Outdated Geyser proxy!" while loading perfectly cleanly, which is
  # exactly how it went unnoticed. Bump both together and update the expected build when updating.
  - Geyser-Spigot.jar
  - floodgate-spigot.jar
  - packetevents-spigot-2.13.0.jar   # required by PacketNametagService
  - worldedit-bukkit-7.4.4.jar       # hard depend in plugin.yml
  - VaultUnlocked-2.20.2.jar         # hard depend in plugin.yml
  - item-nbt-api-plugin-2.16.0.jar
  - PunisherX-1.7.2-SNAPSHOT.jar
  - prism-paper-v4.4.jar
  - AxTrade-1.26.1.jar               # trade tax integration

# Files that must NEVER be synced or overwritten by a deploy, at any time.
never_touch:
  - plugins/SMPCore/smpcore.db
  - plugins/*/database*
  - world/dimensions/*/*/region
  - world/dimensions/*/*/entities
  - world/players
  - plugins/AuthMe
  - plugins/ReplayCore/recordings
