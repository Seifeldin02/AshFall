world-boss:
  name: The Ashen Knight
  health: 2000.0
  damage: 17
  scale: 1.35
  # Still the most movable of the three, so knockback remains a real tool against something -- but it now
  # absorbs 25% more of what it used to take. Resistance is the fraction of incoming knockback ignored, so
  # "25% less shove" is 1 - (1 - 0.35) * 0.75, not 0.35 * 1.25.
  knockback-resistance: 0.5125
  # Minimum gap between ordinary melee swings, in ms. Special abilities are unaffected -- this only stops
  # basic retaliation landing the instant you step in, which left no window to trade hits.
  melee-cooldown-ms: 1300
  reward-min: 126562.5
  reward-max: 253125
  active-radius: 50
  active-seconds: 60
  mechanic-interval-seconds: 13
  judgment-damage: 8.0
  disengage-regen-percent: 0.01
  reward-extra-player-factor: 0.35
  event-duration-minutes: 120
  spawn-radius-min: 1200
  spawn-radius-max: 4000
  first-hint-minutes: 10
  second-hint-minutes: 20

