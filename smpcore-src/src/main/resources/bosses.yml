piglin-brute-boss:
  name: The Cinder Warlord
  health: 3100.0
  damage: 18
  scale: 1.8
  # Was punt-able enough that keeping it permanently airborne was itself a soft cheese; now takes a further
  # 25% less shove on top of that.
  knockback-resistance: 0.8125
  melee-cooldown-ms: 1300
  reward-min: 126562.5
  reward-max: 253125
  reward-gold-blocks: 64
  # Jackpot, not a routine payout: the 3x3 excavator pickaxe should be a rare story, not the expected
