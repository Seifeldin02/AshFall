  first-hint-minutes: 10
  second-hint-minutes: 20

world-boss-targeting:
  # How far a world boss will chase/acquire a player. Replaces the old doubled FOLLOW_RANGE, which let a
  # boss lock onto someone from far outside the fight and never let go.
  range: 50
  # Minimum seconds to keep the current target before switching, so the boss commits to whoever it is
  # fighting instead of flip-flopping every time someone else lands a hit.
  target-stability-seconds: 4
  # A target beyond range for this long is dropped, the in-flight path is cancelled, and the boss
  # re-acquires the nearest valid player (or nobody). This is a hard leash: past `range` a boss will not
  # follow you home, and none of the assist/anti-cheese behaviour fires either.
  lose-target-seconds: 3
  # How long after being hit by a non-player a world boss will still retaliate against it, in seconds.
  # A boss never picks a mob target on its own -- only something that actually damaged it becomes valid,
  # and players always take priority -- so kiting mobs in still cannot pull it off a real fight.
  retaliation-seconds: 8
  # Ordinary acquisition is HORIZONTAL (range above) plus this vertical bound, so a boss will not aggro
  # someone flying far overhead who is not involved. The bound is waived for anyone actively attacking it,
  # which closes vertical bow cheese without letting bosses chase across the map.
  vertical-range: 30
  # How long after hitting the boss a player still counts as actively engaged with it.
  attacker-memory-seconds: 12
  # How long the boss commits to a mob that hurt it before returning to its normal target, so several
  # attacking mobs cannot make it pivot every tick.
  retaliation-commit-seconds: 4

world-boss-unreachable:
  # Seconds an ENGAGED target must be genuinely unpathable before the boss acts.
  seconds: 3
  # A path counts as reaching the target only if it ENDS within this distance of them. Without this,
  # Pathfinder returns a partial path to the nearest reachable point and the boss thinks a player on a
  # 30-block pillar is reachable, which is why the anti-cheese never fired.
  path-tolerance: 3
  action-cooldown-seconds: 2
  # Safety ceiling on blocks removed per pulse across the whole operation.
  max-blocks: 250
  # MARGIN added around the boss's real bounding box (they are large models, so a flat radius barely
  # cleared their own shoulders). Never digs below itself except via the slam below, and never touches
  # bedrock, portals, other permanent blocks, spawn, or claims.
  clear-radius: 2
  clear-height: 3
  # Per-boss footprints. The Colossus is the demolition specialist: widest and tallest reach. The Warlord
  # is middling and closes with a lunge. The Knight is the most surgical but has the strongest downward
  # grasp, which suits a caster-flavoured skeleton over brute force.
  iron-golem-boss:
    clear-radius: 3
    clear-height: 6
  piglin-brute-boss:
    clear-radius: 2
    clear-height: 5
  world-boss:
    clear-radius: 2
    clear-height: 4
  # Height camping: how far horizontally a camper can be and still be considered "above" the boss.
  pillar-horizontal: 14
  # How far below its target a boss must be before it is treated as having FALLEN IN rather than being
  # tower-cheesed. Below this it digs upward and launches back toward the surface instead of milling about
  # at the bottom of a ravine where nobody can reach it.
  sunken-depth: 6
  # A lunge needs a navigation reason, not just a timer. Beyond this horizontal distance a boss is allowed
  # to treat closing as a traversal problem and leap; inside it, it walks and swings like anything else.
  catchup-distance: 18
  climb-out-seconds: 2.0
  climb-out-max-lift: 1.35
  # The disc of blocks removed from under a high camper each pulse (radius 2 = 5x5), and how deep.
  collapse-radius: 2
  collapse-depth: 3
  # Downward tug applied so they actually come off the perch. Cap only -- deals no damage itself.
  pull-max: 1.1
  # Cinder Warlord lunge: 0 = no ceiling, solved from the real height gap. Sustain re-applies the impulse
  # while still rising, since the mob's own movement erases a single setVelocity on the next tick.
  warlord-lunge-horizontal: 0.9
  warlord-lunge-max: 0
  warlord-lunge-sustain-ticks: 8
  # Approach corridor: how far ahead the boss carves a tunnel toward its target. Sized to the boss's real
  # hitbox, so a wide boss opens a gap it can actually fit through instead of a 1x1 hole it snags on.
  approach-reach: 12
  # Downward breakout when shot from below through a small hole. Only fires when the attacker is genuinely
  # beneath the boss AND unreachable; never digs near the world floor.
  slam-min-drop: 2.5
  slam-depth: 6
  slam-cooldown-seconds: 4
  # The Warlord wades slowly through lava on purpose; instead of speeding it up, it lunges on this much
  # shorter cycle while submerged so there is no safe window to trade hits from.
  warlord-lava-lunge-seconds: 2.5
  # Horizontal power of the lava pounce. This is a flat lunge AT the target, distinct from the tower
  # -climbing launch; vertical is only ever what is needed to clear the height difference.
  warlord-lava-lunge-power: 0.95
  # Upper bound once the lunge scales with the distance it actually has to cover.
  warlord-lava-lunge-max-power: 2.4
  # Used only when the Warlord is submerged in lava and its target is on dry land -- the ordinary hop cannot
  # clear a pool, which let players safely shoot it while it wallowed.
  warlord-lava-escape-power: 2.2
  warlord-lava-escape-lift: 0.95

world-boss-swim:
  # Fallbacks; each boss overrides below. "authority" is how strongly steering overrides existing motion
  # (0-1), "buoyancy" is the floor on downward velocity while submerged.
  speed: 0.28
  authority: 0.45
  buoyancy: -0.05
  # Max climb/dive rate while swimming. Applies symmetrically: a boss chases downward as readily as up,
  # so swimming underneath one is not a hiding place.
  vertical-speed: 0.30
  # The Ashen Knight is an undead skeleton: vanilla makes it sink and try to walk the seabed, so it needs
  # the most help to look like it is actually swimming. Highest authority and real lift.
  world-boss:
    speed: 0.42
    authority: 0.75
    buoyancy: 0.0
  # The Colossus is a walking siege engine, deliberately the heaviest and slowest in water -- it should
  # feel ponderous, just not broken.
  iron-golem-boss:
    speed: 0.26
    authority: 0.55
    buoyancy: -0.04
  # The Warlord sits between the two; water is its bad element (lava is its good one).
  piglin-brute-boss:
    speed: 0.34
    authority: 0.65
    buoyancy: -0.02

world-boss-spawn:
  # A randomly spawned boss must land this far from any protected land (spawn region or faction claim)
  # so a wild spawn can never drop a fight on top of someone's base.
  min-distance-from-protected: 2000
  # Bounded search: give up and postpone the event rather than scanning forever or forcing a bad spot.
  max-attempts: 64
  # Rejects caves/tight pockets -- requires this much open air above the candidate and a solid floor.
  required-headroom: 6
  # Postpone this many minutes when no safe open candidate is found.
  postpone-minutes: 10

world-boss-enrage:
  # Measured from the first time a player actually damages the boss, NOT from when it spawned -- a boss
  # nobody has engaged never enrages and never announces anything.
  after-minutes: 14
  ramp-interval-minutes: 2
  damage-bonus-per-stage: 0.08
  max-stages: 5
  # If nobody has landed a hit for this long the ramp freezes, so disengaging and returning later can't
  # hand the boss free permanent damage stages.
  combat-idle-freeze-seconds: 120

