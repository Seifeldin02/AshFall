  # Continuous minutes with NO eligible player inside nearby-player-radius before an elite expires.
  # This is an abandonment timer, not an age limit: anyone coming within range resets it, so an
  # Epic/Legendary no longer vanishes just because everybody briefly stepped away. Hostile-Mobs-Off
  # removal is separate and still takes effect immediately through its own sweep.
  abandoned-minutes: 30

