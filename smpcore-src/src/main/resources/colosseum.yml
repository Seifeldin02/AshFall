# ============================================================================================
# THE ASHFALL COLOSSEUM
#
# A paid, solo, single-boss encounter fought inside a disposable arena instance with the
# player's own real equipment. Every value a boss has lives here; nothing is compiled in.
#
# This is NOT the world-boss system in a box. Colosseum bosses have their own identities,
# stats, mechanics, reward tables and lifecycle, and they never touch world-boss state,
# participation records, natural spawning or the active-boss restriction.
#
# HOW HEALTH WORKS. Minecraft caps the MAX_HEALTH attribute at 1024, so a boss with more than
# that cannot carry it on the attribute. `health` below is the EFFECTIVE pool: the engine
# health is clamped to 1024 and incoming damage is divided by health/1024, which gives the
# intended pool with a health bar that still drains at the right rate. Set `health` to
# whatever the fight should actually be worth and ignore the cap.
#
# BALANCE INTENT. Difficult but fair for one player in strong enchanted survival gear
# (netherite, Protection IV, Sharpness V, golden apples). Relics and exceptional equipment
# help but are never required. There is no hidden player-count scaling anywhere: a Colosseum
# fight is one player against one boss, always, and the numbers below are the whole story.
# ============================================================================================

# Global concurrency. Each active encounter is its own cloned void world, so this is the real
# ceiling on how much disk, chunk and entity work the Colosseum can be doing at once.
max-concurrent-instances: 4

# How many chunks an instance pulls in per tick while preparing. The arena is ~49 chunks, so
# the default spreads it over two ticks and is invisible to everybody else on the server.
chunks-per-tick: 24

economy:
  # Rewarded victories one player may bank per real day ACROSS the whole Colosseum. This is
  # the money-printing brake: at the default fee/prize it caps Colosseum profit at $1,500,000
  # a day. Resets at midnight Riyadh time, the same day boundary the rest of the server uses.
  daily-rewarded-victories: 3
  # Announce a victory in chat. Losses are never announced.
  broadcast-victories: true
  # Shards a rewarded victory pays, per boss unless a boss overrides it with its own victory-shards.
  #
  # These come from the SAME ShardService and the SAME daily allowance world bosses use -- there is no
  # separate Colosseum shard balance and no second cap. Shards earned from a world boss reduce what a
  # Colosseum win can pay, and the reverse. If the allowance is already spent the win pays zero Shards and
  # says so; the cash and the loot are unaffected.
  victory-shards: 3

# --------------------------------------------------------------------------------------------
# ARENAS
#
# Each arena is a private TEMPLATE world an admin builds in, plus a committed snapshot that
# every encounter is cloned from. Colosseum templates are entirely separate worlds from duel
# maps: editing one can never alter the other. `base-template` is only used the first time an
# arena is created, to copy a duel map's committed snapshot as a non-destructive starting
# point -- after that the Colosseum template is its own thing and the duel map is never read
# again.
# --------------------------------------------------------------------------------------------
arenas:
  ashen_colosseum:
    name: "The Ashen Colosseum"
    base-template: arena100
    # Where the player lands, and where the boss is summoned. Far enough apart that the
    # encounter starts with a moment to look at what has arrived.
    player-spawn: [0.5, 65.0, -30.5]
    boss-spawn: [0.5, 65.0, 20.5]
    spectator: [0.5, 90.0, 0.5]
    # The playable cuboid: the only area chunks are loaded for, the only area a player may be
    # in, and the boundary every escape guard is measured against.
    bounds: [-50, 64, -50, 49, 319, 49]

# --------------------------------------------------------------------------------------------
# BOSSES
#
# style / difficulty are display strings shown in the GUI.
# health           effective pool (see the note at the top of this file)
# damage           melee attack damage attribute
# armor            ARMOR attribute -- straight percentage reduction on physical damage
# armor-toughness  reduces how much high-damage hits cut through armor
# movement         MOVEMENT_SPEED attribute (a zombie is 0.23, a vindicator 0.35)
# knockback-resistance  0 = punted freely, 1 = immovable
# time-limit-seconds    running out is a LOSS: the fee is kept and nothing is paid
# entry-fee / cash-prize   see economy above. The fee is never refunded on a victory, so the
#                          profit on a win is (cash-prize - entry-fee).
# reward-limit     optional per-boss daily rewarded-victory cap, on top of the global one.
#                  0 or absent means only the global cap applies.
# available        false hides the boss from the menu and refuses entry.
# --------------------------------------------------------------------------------------------
bosses:

  # ---------------------------------------------------------------- 1. the duel
  emberbound_duelist:
    name: "Emberbound Duelist"
    icon: NETHERITE_SWORD
    style: "Duellist"
    difficulty: "Hard"
    arena: ashen_colosseum
    entity: WITHER_SKELETON
    # NETHER. A Wither Skeleton is a Nether-native mob and burns in Overworld daylight; the only reason it
    # did not was that the arena pinned its time to midnight, which is an incidental protection a single
    # edit to that line would have removed. Running it in a Nether-environment instance makes the
    # protection structural. The arena is the same committed template, the same blocks and the same bounds
    # -- no Nether terrain is generated, because terrain comes from the void generator and the region files.
    environment: NETHER
    scale: 1.25
    strength: "Answers your rhythm — its guard punishes anyone who never stops swinging."
    weakness: "The Riposte only threatens somebody who keeps attacking into it."
    counterplay: "Stop hitting for two seconds when it sets its guard; punish the slow recovery after a Lunge."
    lore:
      - "A swordsman burned into his own oath."
      - "Reads your rhythm and answers it."
    health: 1800.0
    damage: 17.0
    armor: 6.0
    armor-toughness: 2.0
    movement: 0.30
    knockback-resistance: 0.4
    follow-range: 64.0
    time-limit-seconds: 300
    entry-fee: 500000
    cash-prize: 1000000
    available: true
    abilities:
      # RIPOSTE. Telegraphed with a glow and a rising note; while the stance holds, melee hits
      # are cut hard and a share is returned to the attacker as magic damage. The counterplay
      # is simply to STOP HITTING for two seconds -- which is the entire point of the fight.
      riposte:
        cooldown-seconds: 14
        telegraph-ticks: 30
        duration-ticks: 40
        damage-taken-multiplier: 0.25
        reflect-fraction: 0.35
        reflect-cap: 8.0
      # LUNGE. Closes distance from range with a visible ember trail, then is briefly slowed --
      # the punish window. Never used point-blank, so it cannot chain into a stunlock.
      lunge:
        cooldown-seconds: 9
        telegraph-ticks: 20
        min-range: 6.0
        max-range: 22.0
        power: 1.25
        recovery-ticks: 30
      # FLURRY. Three quick strikes at melee range after a wind-up. Each is a normal attack
      # and is fully blockable and avoidable by stepping out.
      flurry:
        cooldown-seconds: 17
        telegraph-ticks: 25
        strikes: 3
        strike-interval-ticks: 8
        damage: 7.0
        range: 4.5

  # ---------------------------------------------------------------- 2. the siege
  warden_of_cinders:
    name: "Warden of Cinders"
    icon: MAGMA_BLOCK
    style: "Area control"
    difficulty: "Very hard"
    arena: ashen_colosseum
    entity: IRON_GOLEM
    environment: NORMAL
    scale: 1.5
    strength: "Heavy armour, immovable, and it removes the ground you are standing on."
    weakness: "While it braces it cannot move or attack at all."
    counterplay: "Step off the marked ground before a Fissure lands; use the Bulwark to heal and reposition."
    lore:
      - "Slow, deliberate, and impossible to push."
      - "It does not chase you. It removes where you stand."
    health: 2600.0
    damage: 20.0
    armor: 12.0
    armor-toughness: 6.0
    movement: 0.20
    knockback-resistance: 0.95
    follow-range: 64.0
    time-limit-seconds: 420
    entry-fee: 500000
    cash-prize: 1000000
    available: true
    abilities:
      # FISSURE. Marks a ring of ground with magma particles and a warning tone, then erupts
      # 1.5s later. Pure particles and damage -- it never edits a block, so it cannot damage
      # the arena or open an escape. Step off the marks.
      fissure:
        cooldown-seconds: 12
        telegraph-ticks: 30
        radius: 5.0
        rings: 2
        # Dealt as MAGIC, so armour does not erase it -- see the note in ColosseumBosses.hurt(). Protection,
        # Resistance, absorption and totems all still apply, and stepping off the marks avoids it entirely.
        damage: 12.0
      # BULWARK. Anchors and takes far less damage, but cannot move or attack while it holds.
      # Free repositioning and healing time in exchange for a damage window you cannot win.
      bulwark:
        cooldown-seconds: 26
        telegraph-ticks: 20
        duration-ticks: 80
        damage-taken-multiplier: 0.2
      # SLAM. Wind-up, then a radial shove with modest damage. Punishes standing in its face
      # forever; survivable anywhere, worst at point-blank.
      slam:
        cooldown-seconds: 15
        telegraph-ticks: 25
        radius: 7.0
        damage: 8.0
        knockback: 1.1

  # ---------------------------------------------------------------- 3. the chase
  ashfallen_revenant:
    name: "Ashfallen Revenant"
    icon: SOUL_LANTERN
    style: "Mobile skirmisher"
    difficulty: "Hard"
    arena: ashen_colosseum
    entity: VINDICATOR
    environment: NORMAL
    scale: 1.15
    strength: "Fast, blinks behind you, and shrugs off arrows once its veil is up."
    weakness: "It is fragile, and the veil only resists ranged damage."
    counterplay: "Turn into the telegraphed blink; dodge the volley; finish the last third in melee."
    lore:
      - "Never where you swung."
      - "Punishes a player who stops moving."
    health: 1500.0
    damage: 14.0
    armor: 4.0
    armor-toughness: 1.0
    movement: 0.36
    knockback-resistance: 0.25
    follow-range: 64.0
    time-limit-seconds: 300
    entry-fee: 500000
    cash-prize: 1000000
    available: true
    abilities:
      # BLINK. Telegraphed with portal particles at BOTH ends, so the destination is visible
      # before it arrives. Lands behind the player at a fixed distance -- turn, or move.
      blink:
        cooldown-seconds: 10
        telegraph-ticks: 20
        behind-distance: 3.0
        max-range: 30.0
      # VOLLEY. Three small fireballs in a spread after a wind-up. Dodgeable, blockable with a
      # shield, and deflectable. Bounded to `count` projectiles, which is what keeps this from
      # ever becoming an unbounded entity source.
      volley:
        cooldown-seconds: 11
        telegraph-ticks: 25
        count: 3
        spread: 0.16
        speed: 0.9
        damage: 7.0
      # VEIL. Below the health threshold it gains speed and shrugs off projectiles, so the
      # last third of the fight has to be closed out in melee.
      veil:
        health-threshold: 0.35
        speed-bonus: 0.06
        projectile-damage-multiplier: 0.35

  # ---------------------------------------------------------------- 4. the bait
  chainbound_behemoth:
    name: "Chainbound Behemoth"
    icon: CHAIN
    style: "Charging bruiser"
    difficulty: "Very hard"
    arena: ashen_colosseum
    entity: RAVAGER
    environment: NORMAL
    scale: 1.35
    lore:
      - "Chained to its own momentum."
      - "It cannot turn once it has decided where you were."
    strength: "Armoured from the front, nearly immovable, and its charge hits like a wall."
    weakness: "It locks its facing before it charges - a missed charge crashes and stuns it."
    counterplay: "Fight from its flank. Stand in the lane, then step OUT and let it hit the boundary."
    health: 3000.0
    damage: 22.0
    armor: 10.0
    armor-toughness: 4.0
    movement: 0.26
    knockback-resistance: 0.9
    follow-range: 64.0
    time-limit-seconds: 420
    entry-fee: 500000
    cash-prize: 1000000
    # A single blow may not remove more than this share of the pool. Generous -- no ordinary weapon comes
    # close -- and it exists only so an enormous opening hit cannot skip the mechanics the fight is about.
    # It announces itself in the action bar when it fires; damage never quietly disappears.
    max-single-hit-percent: 0.12
    available: true
    abilities:
      # FRONTAL. Hitting its face is the slow way to kill it, and it says so the first time you try.
      # Suspended entirely while it is stunned, which is what makes the crash worth baiting.
      frontal:
        arc-degrees: 110
        damage-multiplier: 0.3
      # HEADLONG CHARGE. Facing is locked a full 1.5s before it moves and cannot change afterwards, so a
      # player can deliberately stand in the lane and leave it. Any MISS is a CRASH: stunned, no frontal
      # armour, double damage taken. It misses by hitting the boundary, hitting a solid block it cannot fit
      # through, or running the full lane without touching anybody.
      #
      # The boss is stepped along the locked vector by the encounter itself rather than shoved with
      # velocity. That is not a style choice: the charge turns the boss's AI off so nothing in the engine
      # can steer it, and an AI-less mob ignores applied velocity completely -- it would stand still for
      # the whole charge and then trip its own no-progress guard.
      charge:
        cooldown-seconds: 16
        telegraph-ticks: 30
        min-range: 8.0
        max-range: 34.0
        # The lane, in blocks. This is BOTH the distance drawn during the wind-up and the distance actually
        # run, so what the telegraph promises is what happens.
        length: 30.0
        # Blocks per game tick. The encounter ticks every 2, so a step is twice this.
        speed: 1.05
        # A hard ceiling on the flight. length / speed is ~29 ticks, so this only ever catches the pathological.
        duration-ticks: 45
        hit-radius: 2.6
        # Vertical reach of the charge, so it cannot hit somebody standing on a pillar above the lane.
        hit-height: 3.0
        damage: 14.0
        knockback: 1.4
        # How far it can climb, and follow the floor down, in one step. This is what lets the lane cross
        # uneven ground instead of stopping at the first stair or running out over a drop.
        step-up: 1
        step-down: 2
        # A missed charge crashes. Turning this off makes an unobstructed miss a plain recovery instead,
        # which removes the encounter's only real punish window -- the counterplay text would then be a lie.
        miss-crashes: true
        # Backstop only: if the boss somehow stops making progress despite a step having been resolved, it
        # crashes rather than grinding in place. The grace covers the launch, so leaving the blocks is never
        # mistaken for a collision.
        stuck-ticks: 4
        stuck-grace-steps: 3
        recovery-ticks: 20
        stun-ticks: 100
        crash-vulnerability: 2.0
        # A second crash cannot land straight after the first, so the stun can never chain indefinitely.
        stun-immunity-ticks: 120
      # CHAIN SWEEP. A low ring with two stated answers: be outside it, or be in the air. Both are drawn.
      sweep:
        cooldown-seconds: 13
        telegraph-ticks: 25
        radius: 6.0
        safe-height: 1.6
        damage: 9.0
      # TRAMPLE LINE. A narrow lane, not an arena-wide blast. One step sideways is the whole answer.
      trample:
        cooldown-seconds: 15
        telegraph-ticks: 25
        length: 14.0
        width: 1.6
        push: 0.9
        damage: 8.0

  # ---------------------------------------------------------------- 5. the support structure
  cinderveil_arcanist:
    name: "Cinderveil Arcanist"
    icon: SOUL_CAMPFIRE
    style: "Warded caster"
    difficulty: "Hard"
    arena: ashen_colosseum
    entity: EVOKER
    environment: NORMAL
    scale: 1.1
    lore:
      - "It does not defend itself. Its seals do."
      - "Kill the structure, then the caster."
    strength: "Three Cinder Seals soak a share of every hit it takes, and it will rebuild one."
    weakness: "Break the seals and the protection goes with them; the Rekindle channel is interruptible."
    counterplay: "Kill seals first. Burst the Arcanist during Rekindle to interrupt it and stagger it."
    health: 2400.0
    damage: 12.0
    armor: 6.0
    armor-toughness: 2.0
    movement: 0.28
    knockback-resistance: 0.5
    follow-range: 64.0
    time-limit-seconds: 420
    entry-fee: 500000
    cash-prize: 1000000
    max-single-hit-percent: 0.12
    available: true
    abilities:
      # TRIUNE WARD. Exactly three seals, ever. Each is a real attackable entity with its health on its
      # name, and each takes a slice off the caster's incoming damage. max-reduction keeps the caster
      # damageable at all times -- this is never an invulnerability phase.
      ward:
        cooldown-seconds: 30
        telegraph-ticks: 25
        radius: 7.0
        seal-health: 60.0
        reduction-per-seal: 0.18
        max-reduction: 0.6
      # ASHEN CIRCUIT. Live lines between the caster and each surviving seal, drawn before they energise.
      # Thin, so everything that is not a line is a safe place to stand -- and most of the arena is.
      circuit:
        cooldown-seconds: 11
        telegraph-ticks: 30
        line-width: 1.1
        damage: 10.0
      # REKINDLE. A long channel to rebuild ONE seal. Deal interrupt-damage during it and the cast breaks,
      # nothing is restored, and the caster is staggered at stagger-vulnerability for stagger-ticks.
      rekindle:
        cooldown-seconds: 24
        telegraph-ticks: 25
        channel-ticks: 80
        interrupt-damage: 55.0
        stagger-ticks: 70
        stagger-vulnerability: 1.8

  # ---------------------------------------------------------------- 6. the brew
  ashglass_alchemist:
    name: "Ashglass Alchemist"
    icon: BREWING_STAND
    style: "Zoning apothecary"
    difficulty: "Very hard"
    arena: ashen_colosseum
    entity: WITCH
    environment: NORMAL
    scale: 1.25
    lore:
      - "It does not chase. It makes the floor expensive."
      - "And every so often it stops to brew."
    strength: "Splits the arena into cost zones, shrugs off hexes, and heals itself mid-fight."
    weakness: "It is soft and completely stationary while distilling."
    counterplay: "Keep moving between zones. Save burst for the brew - interrupting it shatters the mixture."
    health: 2200.0
    damage: 13.0
    armor: 7.0
    armor-toughness: 3.0
    movement: 0.27
    knockback-resistance: 0.45
    follow-range: 64.0
    time-limit-seconds: 420
    entry-fee: 500000
    cash-prize: 1000000
    max-single-hit-percent: 0.12
    available: true
    abilities:
      # VOLATILE MIXTURE. Impact areas are drawn in their own colour before anything is thrown, and each
      # colour means one thing: orange burns, blue slows, purple weakens. Bounded by max-zones, expiring on
      # their own clock. No thrown potion entity, no lingering cloud and no fire is ever created.
      mixture:
        cooldown-seconds: 12
        telegraph-ticks: 25
        zones-per-cast: 2
        max-zones: 3
        radius: 3.5
        spread: 4.5
        zone-duration-ticks: 120
        tick-interval-ticks: 20
        effect-ticks: 60
        scorch-damage: 4.0
        mire-amplifier: 1
        frailty-amplifier: 0
      # ASHGLASS DISTILLATION. It stops fighting and brews. Uninterrupted it recovers heal-percent of its
      # pool -- a real setback, never a reset to full. Interrupted, the mixture shatters: it takes
      # shatter-percent of its own pool, is weakened, and is staggered wide open.
      distillation:
        cooldown-seconds: 30
        telegraph-ticks: 25
        health-threshold: 0.8
        channel-ticks: 90
        interrupt-damage: 65.0
        heal-percent: 0.12
        shatter-percent: 0.06
        shatter-weakness-ticks: 120
        stagger-ticks: 80
        stagger-vulnerability: 1.9
      # UNSTABLE CATALYST. A threshold, not an enrage: it arms once and is spent on the NEXT mixture, which
      # is larger and lasts longer. Announced when it arms and again when it lands.
      catalyst:
        health-threshold: 0.45
        radius-multiplier: 1.4
        duration-multiplier: 1.6
      # CLEANSE. It can drink off a hex, but only this often -- crowd control stays worth using.
      cleanse:
        cooldown-seconds: 22

# --------------------------------------------------------------------------------------------
# REWARD TABLES
#
# Rolled ONCE per victory, after the player's own belongings have been restored. Entries are
# MATERIAL:min-max:chance. `rolls` is how many times the whole table is walked.
#
# Nothing here is granted on a loss, and nothing is granted before restoration succeeds -- if a
# restored inventory has no room the overflow goes to the persistent claim-later stash rather
# than being dropped on the floor or deleted.
# --------------------------------------------------------------------------------------------
rewards:
  emberbound_duelist:
    rolls: 2
    entries:
      - "NETHERITE_SCRAP:1-2:0.45"
      - "DIAMOND:6-14:1.0"
      - "ENCHANTED_GOLDEN_APPLE:1-1:0.18"
      - "EXPERIENCE_BOTTLE:16-32:0.7"
      - "NETHERITE_INGOT:1-1:0.12"
  warden_of_cinders:
    rolls: 2
    entries:
      - "ANCIENT_DEBRIS:1-3:0.55"
      - "DIAMOND_BLOCK:1-2:0.6"
      - "ENCHANTED_GOLDEN_APPLE:1-2:0.25"
      - "EXPERIENCE_BOTTLE:24-48:0.8"
      - "NETHERITE_INGOT:1-2:0.16"
  ashfallen_revenant:
    rolls: 2
    entries:
      - "NETHERITE_SCRAP:1-2:0.4"
      - "DIAMOND:6-12:1.0"
      - "GOLDEN_APPLE:2-5:0.6"
      - "EXPERIENCE_BOTTLE:16-32:0.7"
      - "ENDER_PEARL:4-8:0.5"

  chainbound_behemoth:
    rolls: 2
    entries:
      - "ANCIENT_DEBRIS:1-2:0.5"
      - "IRON_BLOCK:4-8:0.9"
      - "DIAMOND:6-12:0.9"
      - "ENCHANTED_GOLDEN_APPLE:1-1:0.22"
      - "EXPERIENCE_BOTTLE:20-40:0.75"
  cinderveil_arcanist:
    rolls: 2
    entries:
      - "NETHERITE_SCRAP:1-2:0.42"
      - "LAPIS_BLOCK:3-6:0.85"
      - "DIAMOND:6-12:0.95"
      - "AMETHYST_SHARD:8-16:0.7"
      - "EXPERIENCE_BOTTLE:24-44:0.8"
  ashglass_alchemist:
    rolls: 2
    entries:
      - "NETHERITE_SCRAP:1-2:0.45"
      - "DIAMOND:6-12:0.95"
      - "GLOWSTONE_DUST:16-32:0.8"
      - "ENCHANTED_GOLDEN_APPLE:1-1:0.2"
      - "EXPERIENCE_BOTTLE:20-40:0.78"

# Experience granted on a victory, split across a handful of orbs so it is collectable.
victory-experience: 600

# Sounds. Deliberately restrained, and deliberately NOT a victory fanfare at the start.
sounds:
  click: UI_BUTTON_CLICK
  confirm: BLOCK_NOTE_BLOCK_PLING
  cancel: BLOCK_NOTE_BLOCK_BASS
  start: BLOCK_RESPAWN_ANCHOR_SET_SPAWN
  victory: UI_TOAST_CHALLENGE_COMPLETE
  defeat: ENTITY_ELDER_GUARDIAN_CURSE
  telegraph: BLOCK_NOTE_BLOCK_BIT
