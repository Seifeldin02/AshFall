server-name: Ashfall Concord
starting-balance: 250.0

maintenance:
  enabled: false

integrations:
  # Plugins SMPCore disables at startup. ReplayCore is deliberately off: its recording is controlled only
  # from its own cloud dashboard, so switching it off locally is the only way to keep it off, and it must
  # stay that way unless explicitly re-enabled.
  #
  # This block used to exist ONLY in the live config.yml on each server and never in the repo, so promoting
  # the repo copy silently dropped it from both servers at once -- and because the deploy checker compares
  # staging against production, losing it in both places read as "in sync". It is tracked here now, and the
  # checker asserts it separately, so neither failure mode can repeat.
  disabled-plugins:
  - ReplayCore

roles:
  admin-player: ""

trusted-admin:
  accounts: [MacoCT, Asserto]

nickname:
  random-names:
    - WandererAsh
    - CinderScout
    - QuietNomad
    - EmberVale
    - LostMiner

ui:
  update-ticks: 40
  snapshot-update-ticks: 100
performance:
  tab-refresh-ticks: 100
  spawner-hover-ticks: 10
  world-borders:
    enabled: true
    warning-distance: 32
    sizes:
      overworld: 225000
      nether: 57000
      end: 175000
  health-below-name: true

rate-limits:
  commands:
    minimum-interval-ms: 500
    # Re-running the exact same command within this window is blocked (double-taps, macros).
    duplicate-window-ms: 3000
  chat:
    cooldown-seconds: 10
    # Flat floor between any two messages, and how long the same message stays blocked.
    minimum-interval-ms: 1000
    duplicate-window-ms: 3000

pvp:
  drop-player-head: true

death:
  balance-loss-percent: 10.0
  balance-loss-cap: 10000.0

factions:
  max-members: 3
  max-alliances: 2
  invite-seconds: 120
  friendly-fire: false
  border-view-distance: 48

claims:
  world: world
  starting-size: 50
  sizes: [50, 70, 90, 110, 130, 150]
  expansion-costs: [50000, 150000, 500000, 1500000, 5000000]
  prevent-faction-explosions: false

homes:
  faction:
    free: 1
    upgrades:
      2: 10000
      3: 30000
  personal:
    free: 1
    upgrades:
      2: 2500
      3: 8000
      4: 30000
      5: 100000
      6: 400000
      7: 1500000
      8: 5000000
      9: 15000000
      10: 50000000

spawner-breaking:
  money-reward: 25
  exp-min: 15
  exp-max: 43
  relocated-break-seconds: 10
  relocated-durability-cost: 512

spawners:
  max-stack: 10
  # Placed spawners only -- natural world spawners keep vanilla behaviour entirely.
  # 5-10 second cycle (100-200 ticks).
  # 8-12 seconds. Was 5-10s (100-200); this is roughly a 25% throughput cut, which reduces drops, XP and
  # money together rather than nerfing any one of them separately.
  min-delay-ticks: 160
  max-delay-ticks: 240
  # Vanilla suppresses a spawner once a few mobs are nearby, which throttles any real farm. Lifted here.
  max-nearby-entities: 2048
  required-player-range: 32
  spawn-range: 4
  # Virtual stacking: a placed spawner keeps only a few real entities and folds further spawns into them
  # as an internal count (rendered "Blaze x50"). A new representative appears only once the current one
  # reaches the cap. Throughput is limited by the CYCLE alone -- never by how many mobs are already there.
  virtual-stack-cap: 100
  # Larger than the spawn range on purpose: representatives drift (Blazes fly), and a farm should settle
  # into as few entities as the cap allows rather than leaving stacks stranded side by side.
  virtual-merge-radius: 12
  # How often stacked representatives are consolidated, in ticks.
  consolidate-interval-ticks: 40

graves:
  lifetime-hours: 48

ender-chest:
  # Tier 0 (free) is always exactly 27 slots -- the real vanilla Ender Chest, not configurable here since
  # it IS the vanilla chest. Tiers 1-3 are purchased, each granting the total slot count below (not an
  # incremental add-on) for the listed one-time price.
  tiers:
    1:
      slots: 45
      price: 200000
    2:
      slots: 72
      price: 750000
    3:
      slots: 90
      price: 1500000

random-spawn:
  enabled: true
  radius: 5000
  attempts: 16

teleport:
  warmup-seconds: 3
  pvp-lock-seconds: 30
  cooldown-seconds: 10
  move-tolerance: 0.35
  request-seconds: 60

rtp:
  radius: 5000
  request-throttle-seconds: 4
  warmup-seconds: 3
  protected-distance: 1000
  attempts: 32
  radii:
    overworld: 5000
    nether: 4000
    end: 5000

bounties:
  minimum: 100
  large-announcement: 10000
  repeat-pair-days: 7
  placement-fee-percent: 2.0
  claim-tax-percent: 3.0
  admin-approval-threshold: 10000
  auto:
    window-hours: 72
    distinct-victims-threshold: 4
    cooldown-hours: 24
    base-amount: 5000
    treasury-percent-cap: 0.02

pay:
  # Tax on /pay, taken OUT OF the transfer rather than added on top: /pay 100 debits the sender exactly 100,
  # the recipient receives 99, and 1 goes to the Central Bank. Same principle as every other fee here --
  # money leaving circulation is deposited, never deleted.
  # Off. Taxing player-to-player transfers was not worth the friction it created.
  tax-percent: 0.0

trade-tax:
  # Applies Ashfall's transaction tax to completed AxTrade direct trades. Requires AxTrade; if it is not
  # installed (or its API changes) this silently does nothing and trades are unaffected.
  enabled: true
  # Defaults to the auction sale tax if unset.
  # Off, same reasoning as pay.tax-percent.
  percent: 0.0
  # Charged on XP moved through a trade: $10 per 100 XP.
  money-per-100-xp: 10
  # Which of AxTrade's currency hooks count as experience rather than money. Everything else moving
  # through a trade is treated as money and taxed at the percent above. Named this way round deliberately:
  # a server that changes economy plugin keeps being taxed, instead of silently stopping because a hook
  # name we hardcoded no longer exists. AxTrade's own hooks are called "Vault" and "Experience".
  experience-hooks:
  - Experience

auctions:
  listing-fee-percent: 3.0
  sale-tax-percent: 5.0
  expiry-hours: 72
  max-active-per-player: 30
  minimum-price: 10

bank:
  # Central Bank income: this much is minted into the bank for every emerald a completed player->villager
  # trade actually consumes (after reputation discount and demand). Player gets nothing.
  villager-trade-income-per-emerald: 100
  overdue-high-value-threshold: 25000
  shop:
    nonsellable-margin-percent: 10
  loans:
    # One successful issuance per real day (counts loans issued, so repaying early does not buy another).
    max-per-day: 1
    reset-hour: 12
    minimum-amount: 500
    # Limits doubled to compensate for the once-per-day restriction: the same player can still reach a
    # similar total over time, they simply cannot cycle many small loans in a single day.
    base-limit: 1000
    per-milestone-limit: 1500
    maximum-limit: 0
    daily-interest-percent: 1.0
    maximum-interest-percent: 25.0
    due-days: 7
    overdue-garnish-percent: 25.0
    input-timeout-seconds: 30

mob-money:
  # Share of the equivalent natural mob's money paid for a mob from a PLAYER-PLACED spawner. Flat: the
  # anti-farm curve below applies to NATURAL mobs only, so a farm's value is predictable before it is built.
  spawner-share: 0.5
  # Past the daily allowance, the share halves again. The allowance counts REPRESENTED mobs, so a stack of
  # 100 spends 100 of it. It resets at 12:00 Asia/Riyadh, and a stack straddling the boundary is split
  # rather than being paid entirely at one rate.
  spawner-reduced-share: 0.25
  spawner-daily-threshold: 10000
  # Neutral mobs that still count as combat income: they get the progression money multiplier and the
  # anti-farm kill accounting, exactly like hostile mobs. Iron Golems are here because they fight back and
  # are farmed deliberately, but are classed Golem rather than Enemy, so they were silently paying base
  # rate with no multiplier. Passive livestock must NOT be listed -- they have reward entries too.
  combat-income-extra:
  - IRON_GOLEM
  anti-farm-window-minutes: 10
  full-reward-kills: 20
  soft-reward-kills: 50
  hard-reward-kills: 100
  soft-multiplier: 0.5
  minimum-multiplier: 0.25
  farm-weights:
    ZOMBIFIED_PIGLIN: 2.0
    MAGMA_CUBE: 1.5
    BLAZE: 1.25
    ENDERMAN: 2.0

shop:
  sell-control:
    default-full-quantity: 256
    reduced-multiplier: 0.50

merchants:
  boss-scroll-price: 1000000
  boss-sigil-count: 8
  boss-sigil-price: 250000
  boss-legendary-sigil-count: 2
  boss-chosen-price: 2000000
  event-cooldowns-minutes:
