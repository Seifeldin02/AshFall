arena:
  # A void world built by us rather than a downloaded map, so there is no third-party world to vet.
  world: ashfall_arena
  # How long a disconnected duellist has to come back before forfeiting the round.
  reconnect-grace-seconds: 45
  # How many duels can run at once, each in its own isolated arena slot.
  max-concurrent-duels: 6
  # Cooldown between challenges, like a trade request, so invites cannot be spammed.
  challenge-cooldown-seconds: 15

orders:
  # Native buy orders. Escrow is taken from the buyer at creation and released per delivered unit; every
  # movement of it is a conditional UPDATE, so it cannot be paid or refunded twice.
  max-per-player: 10
  max-amount: 3456
  expiry-days: 7
  # Taken from the seller's payout, into the Central Bank.
  tax-percent: 2.5
  expiry-check-seconds: 60

industrial-hopper:
  # Items moved per hopper per tick. Vanilla moves one item every 8 ticks; this is the whole point of the
  # block, so it is deliberately far higher. Ticking is centralised, not one task per hopper.
  items-per-tick: 9
  # How often the central sweep runs, in ticks. Deliberately matched to vanilla's own hopper cooldown.
  #
  # Vanilla throttles hoppers to one transfer every 8 ticks because per-tick container scanning is the
  # single most reliable way to kill a server's tick rate, and hoppers are the block players build most.
  # Sweeping every tick made this block 72x vanilla throughput but also 8x vanilla's per-hopper CPU cost,
  # on a block that is craftable and will be mass-produced. Nine items every 8 ticks is still 9x vanilla
  # throughput at 1/8th the cost of the previous cadence -- the same work vanilla does, done nine times
  # harder, rather than eight times more often.
  tick-period: 8

bulletin:
  # How often everyone's stats are recomputed (two bulk queries). Deliberately slow.
  refresh-seconds: 40
  # How often a missing private panel is noticed and drawn from the in-memory snapshot. Cheap and separate
  # from the recompute above, so logging in away from spawn no longer means waiting a whole refresh period
  # after walking up to the bulletin before your stats appear.
  presence-ticks: 20

