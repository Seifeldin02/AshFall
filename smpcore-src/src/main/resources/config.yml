    NETHERITE_PICKAXE: 15000
    NETHERITE_HELMET: 15000
    NETHERITE_CHESTPLATE: 20000
    NETHERITE_LEGGINGS: 18000
    NETHERITE_BOOTS: 15000
    DIAMOND_SWORD: 1200
    DIAMOND_PICKAXE: 1200
    DIAMOND_HELMET: 1000
