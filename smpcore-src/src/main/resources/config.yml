events:
  automatic: true
  protected-area-radius: 100

nametags:
  # How often the overlay is refreshed, in ticks. Deliberately slow: it only needs to keep up with balance
  # and health changes, and a packet is sent only when the visible result actually differs.
  refresh-ticks: 20
  # Text size of the replacement tag.
  scale: 1.0
  # Height of the replacement nametag above the mount point. Because the overlay REPLACES the vanilla
  # nametag (mounting suppresses it), this should sit roughly where that nametag used to be.
  lift: 0.30
  # Background of the overlay. 0 = fully transparent (no backdrop square). Vanilla's own nametag backdrop
  # is 1073741824 (0x40000000) if you ever want it back.
  background-argb: 0
  # Colour of the faction tag. Any Minecraft colour name (AQUA, BLUE, GOLD, GREEN, ...).
  faction-color: AQUA
  # Display view-range multiplier; the earlier 0.6 made it vanish at close range.
  view-range: 1.0
  # Furthest a tag is sent, in blocks. Past this the client holds no player entity to mount it onto, so the
  # tag would strand where that client last saw them. Tags are torn down at max-distance + 16 and re-sent
  # inside max-distance; the gap keeps someone walking the boundary from flapping spawn/destroy.
  max-distance: 48
  # Crouching shortens how far the name carries, as vanilla does, on top of hiding it behind blocks.
  sneak-view-range-factor: 0.5
  # Alpha (0-255) of the see-through pass -- what you see when the player is behind terrain. Vanilla draws
  # this pass at 32; slightly higher here because our tag carries more than a name. Set 0 to make tags
  # vanish behind walls entirely instead of dimming.
  obstructed-alpha: 40
  # Alpha of the tag while its owner is crouching. Vanilla dims a crouched name and stops drawing it
  # through terrain at all; 255 would keep it full strength.
  crouch-alpha: 115
  # How often one viewer's tags are torn down and rebuilt as a safety net. Track/untrack events normally
  # keep everything correct, so this only exists so a single missed packet cannot leave one specific pairing
  # permanently blank. One viewer per pass, so the cost does not grow with the player count.
  resync-ticks: 100

