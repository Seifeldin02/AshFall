    ECHO_SHARD: 5000
  spawners:
    # Virtual stacking made placed spawners a genuine income engine rather than decoration, so the highest
    # earners are valued accordingly. IRON_GOLEM matches the Dragon Egg at 1,000,000 as the flagship buy.
    IRON_GOLEM: 1000000
    default: 25000
