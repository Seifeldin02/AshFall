name: SMPCore
version: 1.7.0
main: net.communitysmp.core.SMPCore
api-version: '26.2'
authors: [ServerOwner]
description: Lightweight factions, economy, travel, markets, bosses, events and exploration.
depend: [Vault, WorldEdit]
softdepend: [packetevents, AuthMe, floodgate, Geyser-Spigot, TAB, SkinsRestorer, GrimAC, Nicked, ReplayCore, PunisherX, Prism]
loadbefore: [DonutOrders]
commands:
  duel:
    description: Challenge somebody to a wagered 1v1
    usage: /duel <player>
  orders:
    description: Browse and fill buy orders
    usage: /orders
  order:
    description: Place a buy order
    usage: /order
  kit:
    description: Staff test loadout
    usage: /kit test
  f:
    description: Faction commands
    aliases: [faction]
  balance:
    description: View your balance
    aliases: [bal, money]
  pay:
    description: Pay another player
  home:
    description: Teleport to a personal home
  sethome:
    description: Set a personal home
  delhome:
    description: Delete a personal home
  renamehome:
    description: Rename a personal home
  homes:
    description: List personal homes
  buyhome:
    description: Buy the next personal home slot
  tpa:
    description: Request teleport to a player
  tpahere:
    description: Request a player teleport to you
  tpaccept:
    description: Accept a teleport request
  tpdeny:
    description: Deny a teleport request
  spawn:
    description: Teleport to server spawn
  back:
    description: "Admin: return to your previous teleport origin or death location"
  rtp:
    description: Teleport to safe distant wilderness
    aliases: [wild, wilderness]
  msg:
    description: Privately message an online player
    aliases: [w, tell]
  reply:
    description: Reply to your most recent private conversation
    aliases: [r]
  shop:
    description: Open the server shop
  luxuryshop:
    description: Open the Luxury Shop
  shardshop:
    description: Open the Shard Shop
  settings:
    description: Open Ashen Settings
  ah:
    description: Open or manage the auction house
    aliases: [auction, auctionhouse]
  bounty:
    description: Place a bounty
  bounties:
    description: List active bounties
  events:
    description: View the current world event
  relics:
    description: View relic discoveries
  leaderboards:
    description: View server rankings
    aliases: [leaderboard, top]
  guide:
    description: Receive the server handbook
  rules:
    description: Read the Ashfall server rules
  smphelp:
    description: Show the concise server help
    aliases: [serverhelp]
  role:
    description: View your ADMIN or MEMBER role
  sidebar:
    description: Toggle the persistent HUD
  feedback:
    description: Submit a suggestion or bug report
  stats:
    description: View public player statistics
  progress:
    description: View your adventure progression
  history:
    description: Read the server chronicle
  graves:
    description: Select and track active graves
  enderchest:
    description: Open and upgrade persistent Ender storage
    aliases: [ec]
  # warn/warnings intentionally removed: PunisherX now owns /warn (and /history for viewing).
  # SMPCore's old warning data lives on read-only in its own database (warnings table, punishments
  # table) for audit purposes -- migrated copies are in PunisherX's history tagged "[Legacy SMPCore]".
  myorders:
    description: View and claim your DonutOrders buy orders, including partial deliveries
  ashfall:
    description: Ashfall administration
    aliases: [smp, smpcore]
  nickname:
    description: Apply an administrator disguise
    aliases: [disguise]
  discord:
    description: Show the Ashfall Discord invite
  afk:
    description: Toggle AFK status
  admin:
    description: "Console-only SMPCore admin management: list | add <player> | remove <player> | simlogin <name> (test ban-enforcement listeners without a real client)"
  shout:
    description: Send a prominent server-wide announcement
  fly:
    description: Toggle flight for yourself or another player
    usage: /fly [player] [on|off]
    permission: smpcore.fly
  flyspeed:
    description: Set flight speed (1 = normal, up to 10)
    usage: /flyspeed [player] <1-10>
    permission: smpcore.fly
permissions:
  smpcore.admin:
    description: Full SMPCore administration
    default: op
  smpcore.fly:
    description: Use /fly and /flyspeed
    default: op
  smpcore.play:
    description: Normal SMPCore gameplay
    default: true
