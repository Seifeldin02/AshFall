lifecycle:
  exploration-chance: 0.0002
  # Real days the owner must go without a login before a normally-held relic is reclaimed. An active
  # (or expired-but-uncollected) auction listing counts as a valid location and pauses this clock
  # entirely; for an expired-and-uncollected listing the clock starts no earlier than the expiry, and
  # any later login still resets it, same as a normally-held relic.
  reclaim-after-real-days: 7
  # Real days after a reclaim before the relic becomes eligible to resurface.
  resurface-after-real-days: 2

relics:
  crown_of_ash:
    name: Crown of Ash
    material: NETHERITE_HELMET
    lore:
      - "The embers remember their first king."
      - "Worn: Fire Resistance and Resistance."
      - "Reduces damage dealt by elites and bosses."
  skyward_anchor:
    name: The Skyward Anchor
    material: HEAVY_CORE
    lore:
      - "It fell from nothing, and has been trying to return ever since."
      - "Held: right-click while standing to be thrown skyward."
      - "The stone remembers which way is up."
  wayfinder:
    name: The Wayfinder
    material: COMPASS
    lore:
      - "Its needle trembles toward forgotten roads."
      - "Held: Speed and Night Vision."
  oathblade:
    name: Oathblade
    material: DIAMOND_SWORD
    lore:
      - "Deals 25% more damage to elites and bosses."
      - "Steals a trace of life from powered enemies."
  ashen_reprisal:
    name: Ashen Reprisal
    material: BLAZE_ROD
    lore:
      - "A shard of the Ashen Knight's own judgment strike."
      - "Right-click: unleash a searing line strike."
      - "Scorches and launches every foe in a cone before you."
  colossus_core:
    name: Colossus Core
    material: CONDUIT
    lore:
      - "The still-warm heart of the Warded Colossus."
      - "Right-click: brace like iron and hurl back all who press in."
      - "Grants a brief shield of resistance and a shockwave of force."
  warlords_ember:
    name: Warlord's Ember
    material: FIRE_CHARGE
    lore:
      - "A coal plucked from the Cinder Warlord's own hearth."
      - "Right-click: charge forward in a blazing dash."
      - "Scorches anything caught in your path."

buffs:
  # These are globally UNIQUE artifacts -- one of each exists on the whole server -- and were tuned like
  # ordinary enchantments. Each now has a single unmistakable identity instead of a small statistical edge.
  # Friendly-faction, NPC and spawn protections are enforced in code (relicEffectTarget / relicBlockedInSpawn)
  # and are unaffected by any value here. Nothing applies permanent crowd control.
  crown-of-ash:
    # Identity: you survive what others cannot. Halves elite and boss damage taken.
    elite-damage-multiplier: 0.50
  oathblade:
    # Identity: sustain. Hits far harder into elites and bosses, and heals a real share of it back.
    elite-damage-multiplier: 1.85
    lifesteal-percent: 30.0
  ashen-reprisal:
    # Identity: a genuine burst nuke, not a tickle.
    cooldown-seconds: 25
    damage: 26.0
    range: 7.0
  colossus-core:
    # Identity: displacement. Throws everything nearby, INCLUDING world bosses, then leaves anything it hit
    # staggered -- heavy slowness and mining fatigue -- for a few seconds. Long cooldown pays for it.
    cooldown-seconds: 45
    brace-seconds: 4.0
    radius: 8.0
    knockback: 3.4
    boss-knockback: 2.6
    stagger-seconds: 5.0
  skyward-anchor:
    # A slam, not a jump. Right-click launches you AND arms it; it discharges on the first of: touching an
    # entity on the way down, touching the ground, or landing a mace hit.
    #
    # Roughly how many blocks the launch reaches. Velocity is derived from this (v = sqrt(2*g*h)) rather
    # than hardcoded, so changing the height here actually lands where it says.
    height: 20
    cooldown-seconds: 20
    # Half-width of the damage cube, so 1.5 is the 3x3x3 the relic is described by.
    aoe-radius: 1.5
    # Damage is this fraction of a MAXIMUM-DENSITY mace for the same drop. Below 1.0 on purpose: this is
    # area damage that is very hard to miss, so it should lose a straight trade against a mace.
    mace-scale: 0.9
    # How centred the target was under you. Only HORIZONTAL offset counts -- the box is a cube and vertical
    # position inside it is not a skill expression.
    centre-multiplier: 1.5
    edge-multiplier: 0.5
    # Wind burst. Each target hit adds this many blocks of launch height, so two targets is twice the
    # height. Capped only to stop an absurd stack from throwing somebody into the void.
    #
    # 2.5 was roughly a plain mace's hop and read as "that is not a wind burst". Six is a genuine
    # Wind Burst II-sized launch, and it still multiplies per target.
    burst-height-per-hit: 6.0
    max-burst-hits: 8
    # Elytra: measured from straight down, so 0 is a vertical dive and 90 is level flight. Past this angle
    # the accumulated drop is surrendered -- but the relic stays armed, because you did pay for the charge.
    elytra-max-dive-angle: 40
    # How long an armed anchor survives without discharging.
    arm-seconds: 30
    # Mace combo: weapon damage multiplier on the entity you actually hit. The wind burst is doubled
    # separately, and the mace hit gains the relic's own area damage.
    mace-combo-multiplier: 2.0
    # Landing behaviour (2026-08-24 rework).
    #
    # The relic now resolves ONLY on landing -- there is no mid-air "you touched a mob" trigger, because it
    # fired before you could ever swing and made the mace combo unreachable. Fall, swing whenever you like,
    # and the slam happens when you arrive.
    #
    # Immunity granted the instant a slam CONNECTS, so committing to a big dive is not suicide in PvP.
    # Deliberately not granted on a miss: missing still costs the full fall.
    landing-invulnerability-ticks: 10
    # The descent from a wind burst is not charged to the player -- a six-per-target launch reaches twenty
    # blocks easily and would otherwise have the relic killing its own user. Cleared on the first landing.
    burst-fall-grace-seconds: 12
    # Hard ceiling on launch height however many targets were struck.
    max-burst-height: 70
    # The mace combo gets its own launch rather than a doubled slam: a Wind Burst VI-sized throw, still
    # multiplied per target struck.
    mace-combo-burst-height: 22

  warlords-ember:
    # Identity: aggressive mobility that OPENS a combo rather than being a movement toy. The dash keeps its
    # momentum so the wielder can swap weapons mid-flight and land a heavy follow-up while the target is
    # still burning and staggered. Shortest cooldown of the set, because committing forward is the risk.
    cooldown-seconds: 20
    power: 2.6
    radius: 4.5
    # Impact damage on everything caught by the charge; bosses take the same hit but are thrown less far.
    impact-damage: 24.0
    knockback: 1.6
    boss-knockback: 1.1
    # Burn long enough to still be ticking when the follow-up weapon hit lands.
    burn-seconds: 6.0
