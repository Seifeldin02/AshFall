earning:
  # Non-playtime shards a single player may earn per day. Passive playtime shards are completely
  # outside this cap. A reward that would exceed the remainder is trimmed rather than dropped.
  daily-cap: 10
  # Hour (in weekly-dragon.timezone, i.e. Asia/Riyadh) at which everyone's allowance resets.
  daily-reset-hour: 12
  active-seconds-per-shard: 2700
  afk-seconds-per-shard: 3600
  active-window-seconds: 300
  rare-chance: 0.12
  dragon-cooldown-hours: 168
  wither-cooldown-hours: 24
  warden-cooldown-hours: 24

# Prices assume about one shard per 45 minutes of active play. Strong permanent
# rewards therefore remain long-term goals; weekly limits prevent stockpiling abuse.
stock:
