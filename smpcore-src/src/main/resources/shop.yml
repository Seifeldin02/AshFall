items:
  # BUY PRICES ARE DERIVED, NOT AUTHORED: every commodity's buy price is exactly 5x its sell price, computed
  # at load time (shop.buy-multiple). The values written here are kept in sync purely so the file reads
  # truthfully -- editing one by hand does nothing, because the loader recomputes it. Change `sell` instead.
  #
  # This replaces the earlier 9-11x farm-output markup. That markup existed to stop the shop undercutting
  # farming, and it is no longer the mechanism that does so: the shop can now only sell stock that players
  # have actually sold it, so it cannot supply anything nobody farmed, at any price.
  #
  # Sell prices remain the authored economy and are untouched by this.
  # Common spawner-farm drops. Priced conservatively on purpose: a farm should be worthwhile through
  # volume, not because any single drop is valuable.
  ROTTEN_FLESH: {buy: 0.6, sell: 0.12, daily-full: 4096}
  SPIDER_EYE: {buy: 3, sell: 0.60, daily-full: 1536}
  MAGMA_CREAM: {buy: 17.5, sell: 3.50, daily-full: 768}
  PHANTOM_MEMBRANE: {buy: 45, sell: 9.00, daily-full: 384}
  OAK_LOG: {buy: 10, sell: 2.0}
  SPRUCE_LOG: {buy: 10, sell: 2.0}
  BIRCH_LOG: {buy: 10, sell: 2.0}
  COBBLESTONE: {buy: 2.5, sell: 0.5}
  STONE: {buy: 3.75, sell: 0.75}
  DIRT: {buy: 0.25, sell: 0.05}
  SAND: {buy: 5.0, sell: 1.0}
  GRAVEL: {buy: 5.0, sell: 1.0}
  GLASS: {buy: 6.25, sell: 1.25}
  COAL: {buy: 15, sell: 3.0}
  CHARCOAL: {buy: 15, sell: 3.0}
  IRON_INGOT:
    # 5x sell, matching the shop's median margin. Raising sell to 12 without moving buy left iron at 2.5x,
    # the thinnest spread of any item and out of line with everything else.
    buy: 60
    # Raised with the Iron Golem Spawner in mind (see net-worth 1,000,000 / $50mil / 500 shards). The old
    # daily-full of 64 was the real bottleneck: a farm hit reduced value almost immediately, so no iron
    # income was possible at any unit price.
    sell: 12.0
    daily-full: 20000
  COPPER_INGOT:
    buy: 10
    sell: 2.0
    daily-full: 96
  REDSTONE: {buy: 10, sell: 2.0}
  LAPIS_LAZULI: {buy: 10.0, sell: 2.0}
  QUARTZ: {buy: 15, sell: 3.0}
  BREAD: {buy: 5, sell: 1.0, daily-full: 64}
  APPLE: {buy: 5, sell: 1.0, daily-full: 64}
  COOKED_BEEF: {buy: 15, sell: 3.0}
  COOKED_CHICKEN: {buy: 10, sell: 2.0}
  # Farming price tier, reviewed 2026-07-31: staple crops (wheat/carrot/potato/beetroot) get the highest
  # per-unit value and a generous daily-full threshold — they're only really automatable via villager farms,
  # which take real setup (breeding, professions, hoppers). Sugar cane/melon/pumpkin get a lower daily-full
  # specifically because a bare piston+observer farm with zero replanting needed can push far higher volume
  # than any villager farm; the existing 50%-beyond-threshold rule (shop.sell-control.reduced-multiplier)
  # does the actual "no infinite-money" work — a smaller full-price window just makes it bite sooner for the
  # crops where scale is trivial. Nether wart/cocoa beans price higher: real extra travel/biome cost per run.
  WHEAT: {buy: 5.5, sell: 1.10, daily-full: 350}
  WHEAT_SEEDS: {buy: 1.5, sell: 0.30, daily-full: 350}
  CARROT: {buy: 5, sell: 1.00, daily-full: 350}
  POTATO: {buy: 5, sell: 1.00, daily-full: 350}
  BEETROOT: {buy: 5, sell: 1.00, daily-full: 350}
  BEETROOT_SEEDS: {buy: 1.5, sell: 0.30, daily-full: 350}
  SUGAR_CANE: {buy: 15, sell: 3.00, daily-full: 250}
  MELON_SLICE: {buy: 3.5, sell: 0.70, daily-full: 300}
  MELON_SEEDS: {buy: 1.25, sell: 0.25, daily-full: 200}
  PUMPKIN: {buy: 7.5, sell: 1.50, daily-full: 200}
  PUMPKIN_SEEDS: {buy: 1.25, sell: 0.25, daily-full: 200}
  NETHER_WART: {buy: 10, sell: 2.00, daily-full: 300}
  COCOA_BEANS: {buy: 8.75, sell: 1.75, daily-full: 250}
  LEATHER: {buy: 20, sell: 4.0}
  STRING: {buy: 10, sell: 2.0}
  GUNPOWDER: {buy: 25, sell: 5.0}
  BONE: {buy: 7.5, sell: 1.5}
  ARROW: {buy: 1, sell: 0.20, daily-full: 256}
  SLIME_BALL: {buy: 25, sell: 5.0}
  OBSIDIAN: {buy: 40.0, sell: 8.0}
  ENDER_PEARL: {buy: 45, sell: 9.0}
  BLAZE_ROD: {buy: 60, sell: 12.0}

